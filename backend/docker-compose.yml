version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: octobyte-postgres
    environment:
      POSTGRES_DB: octobyte
      POSTGRES_USER: octobyte
      POSTGRES_PASSWORD: octobyte
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octobyte -d octobyte"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
