spring.application.name=octobyte-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/octobyte
spring.datasource.username=octobyte
spring.datasource.password=octobyte

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Serial
esp32.serial.baud-rate=9600
esp32.serial.default-port=ttyUSB0
esp32.simulation.timeout-seconds=60
esp32.simulation.enabled=true

# Logging
logging.level.com.octobyte=INFO
