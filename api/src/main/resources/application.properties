spring.application.name=api
# URL de conexión (cambia 'mi_base_de_datos' por el nombre de tu BD) [0.1.2]
spring.datasource.url=jdbc:postgresql://localhost:5432/Energia

# Usuario y contraseña de PostgreSQL (por defecto suele ser 'postgres') [0.1.1, 0.1.6]
spring.datasource.username=admin
spring.datasource.password=admin

# Driver de la base de datos
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate [0.1.6]
# Evitar que Hibernate cree tablas nuevas cuando ya existen en la BD real
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
